project_id = "bclktrcbwpwsxksbhqsv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[functions.send-post-notification]
verify_jwt = true

[functions.whatsapp-webhook]
# Chamada pela uazapi (não por um usuário logado no app) — a autenticação
# é feita por um segredo compartilhado (WHATSAPP_WEBHOOK_SECRET), não por
# JWT do Supabase. Ver ARCHITECTURE_WHATSAPP_IA.md.
verify_jwt = false

[functions.product-change-webhook]
# Chamada pelo Database Webhook do Supabase (Dashboard → Database →
# Webhooks) quando a tabela products muda — não é um usuário logado.
# Autenticação por segredo compartilhado (PRODUCT_NOTIFICATIONS_SECRET).
verify_jwt = false

[functions.unsubscribe]
# Chamada pela página pública /descadastro, sem login (o token no link
# já identifica o cliente).
verify_jwt = false

[functions.app-chat]
# Usada tanto por clientes logados quanto anônimos (o app pode navegar
# sem cadastro) — a própria função trata os dois casos, então não exige
# JWT do Supabase de cara.
verify_jwt = false